version: "3"
services:
  mysql:
    image: mysql:latest
    networks:
      - crabc_network
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - /opt/crabc/mysql:/var/lib/mysql
      # 加载库表数据
      - /opt/crabc/mysql/init:/docker-entrypoint-initdb.d
    environment:
      - MYSQL_ROOT_PASSWORD:=admin123
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin123
  crabc-api:
    image: crabc/crabc-api:latest
    container_name: crabc-api
    depends_on:
      - mysql
    networks:
      - crabc_network
    ports:
      - "9377:9377"
    environment:
      # 环境变量名大小写敏感：application.yml 里是 ${DB_URL}/${DB_USER}/${DB_PWD}
      - DB_URL=jdbc:mysql://mysql:3306/crabc
      - DB_USER=root
      - DB_PWD=admin123
      # JWT 签名密钥，必填；未设置时应用启动失败（生成：openssl rand -base64 32）
      - JWT_SECRET=${JWT_SECRET:?请先设置 JWT_SECRET 环境变量}
networks:
  crabc_network:
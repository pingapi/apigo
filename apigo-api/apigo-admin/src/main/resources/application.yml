# Server
server:
  port: ${SERVER_PORT:9377}
  tomcat:
    # 连接建立后，等待客户端发送HTTP请求头超时
    connection-timeout: 30s
    # Keep-Alive 长连接空闲超时（请求处理完，等待下一次请求）
    keep-alive-timeout: 20s
spring:
  # 本地开发密钥可选导入：application-local.yml 已由 .gitignore 忽略，本机存在时加载，不存在时跳过。
  # 因此正式环境依旧必须通过环境变量 JWT_SECRET 注入，不会回退到任何内置密钥。
  config:
    import: optional:classpath:application-local.yml
  application:
    name: apigo-api
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  # MCP Server：对内嵌的 /mcp 端点暴露 ApiGo 业务工具给 AI 办公平台
  ai:
    mcp:
      server:
        # 与 crabc.mcp.enabled 联动：一处开关同时控制 MCP 端点与鉴权 Filter，
        enabled: ${crabc.mcp.enabled:false}
        name: apigo-mcp-server
        version: 6.0.0
        protocol: STREAMABLE        # STREAMABLE | STATELESS | SSE，三选一不可共存
        type: SYNC                  # 服务端只注册同步方法
        instructions: >-
          ApiGo 是 SQL2API 接口开发平台。典型流程：apigo_datasource_list/create →
          apigo_metadata_tables/columns → apigo_sql_preview → apigo_api_create →
          apigo_api_publish → apigo_app_create → apigo_app_authorize → apigo_log_query。
          任何变更类操作前，请先向用户复述将要执行的变更并获得确认。
        request-timeout: 90s        # 默认20s小于平台SQL执行超时30s，必须调大
        capabilities:
          tool: true
          resource: false           # 本期不提供 Resources
          prompt: false             # 本期不提供 Prompts
          completion: false
        resource-change-notification: false
        prompt-change-notification: false
        tool-change-notification: false
        streamable-http:
          mcp-endpoint: /mcp
          disallow-delete: false
        annotation-scanner:
          enabled: true             # 自动扫描 @McpTool
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    # 下面是本地开发默认值（明文 + 关闭 TLS），生产环境必须通过 DB_URL 覆盖为加密连接
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/apigo?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PWD:}
# mybatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: cn.crabc.core.admin.entity
  # 配置 mapper 扫描，找到所有 mapper.xml 映射文件
  mapperLocations: classpath*:mapper/**/*.xml
  config-location: classpath:mybatis-config.xml

pagehelper:
  autoRuntimeDialect: true   # 开启多数据源分页识别


crabc:
  # Jackson 缓冲区回收池策略：shared（跨线程复用，默认）| thread-local | non-recycling | bounded
  # Boot 4.1 的 spring.jackson.* 不含该配置项，实际由 JacksonConfig 读取本键生效
  jackson:
    recycler-pool: shared
  api-log:
    # 日志是否保存响应结果：默认关闭。大响应体会放大堆内存与 DB 写入，
    # 需要排查问题时临时打开（单条 body 仍有 128K 截断保护）
    response-body: false
  mcp:
    # 默认关闭：MCP 暴露的是整个平台的管理能力（建数据源/改接口/改授权），需要时显式开启
    enabled: false
    # 必须由部署环境注入（建议 openssl rand -base64 32）；为空时 MCP 端点拒绝全部请求（fail-closed）
    token: ${MCP_TOKEN:}
    # 必填：MCP 操作归属用户，决定 createBy/updateBy；建议绑定专用账号而非 admin
    user-id: ${MCP_USER_ID:}
    audit-enabled: true             # 变更类工具是否记录审计日志
    max-page-size: 20               # 工具层分页硬上限
    max-text-length: 2000           # SQL 等长文本截断长度
    allowed-jdbc-schemes: mysql,mariadb,tdsql,tidb,doris,starrocks,postgresql,opengauss,oracle,sqlserver,dm,clickhouse,dolphindb,duckdb,sybase,db2,oceanbase
    # true 时拒绝连接回环/内网地址
    block-internal-host: false
  # JWT 签名密钥：必须由部署环境注入（环境变量 JWT_SECRET），生成方式 openssl rand -base64 32。
  # 未配置、强度不足（解码后少于 32 字节）或仍为历史泄露密钥时，应用启动直接失败，不做默认回退。
  jwt:
    secret: ${JWT_SECRET:}
    key-id: ${JWT_KEY_ID:k1}
    expire-minutes: ${JWT_EXPIRE_MINUTES:480}
    issuer: apigo
    audience: apigo-admin
    clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:60}
